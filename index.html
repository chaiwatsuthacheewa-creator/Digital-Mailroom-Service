    const pal = palettes[i%palettes.length];
    const hasPhoto = Math.random()<0.8;
    const photo = hasPhoto ? makeThumb((isInternal?'INT':'IN')+'-'+String(i+1).padStart(3,'0'), pal[0], pal[1]) : null;
    const bld = rand(bldgs);
    const abbr = dept.abbr;
    const dstr = dt.getFullYear().toString().slice(2)+String(dt.getMonth()+1).padStart(2,'0')+String(dt.getDate()).padStart(2,'0');
    const tracking = isInternal
      ? state.settings.trackingPrefix+bld.code+'-'+abbr+'-'+dstr+'-'+String(seq).padStart(3,'0')
      : ['TH','KE','JT','FL'][i%4]+String(1000000000+Math.floor(Math.random()*8999999999));
    seq++;
    // status distribution
    const r = Math.random();
    let status = r<0.42?'signed': r<0.72?'pending': r<0.85?'redelivery':'return';
    const base = {
      id:genId('doc'), type:isInternal?'internal':'keyin', createdAt:dt.toISOString(), createdBy:'สมชาย ใจดี',
      senderName:rand(senders), tracking, remark: Math.random()<0.3?'ด่วนที่สุด กรุณาส่งภายในวันนี้':'', photo,
      receiverDept:dept.name, quantity:1, status,
      redeliveryCount: status==='redelivery'?1:(Math.random()<0.1?1:0),
      returnCount: status==='return'?1:0, signature:null, signerName:null, signedAt:null, history:[]
    };
    if(isInternal){
      base.building=bld.name; base.senderDept=rand(depts).name; base.senderDesk=String(1000+Math.floor(Math.random()*900));
      base.senderEmpId='00'+(100+Math.floor(Math.random()*899)); base.receiverName=rand(rnames);
      base.receiverDesk=String(2000+Math.floor(Math.random()*900)); base.receiverEmpId='00'+(100+Math.floor(Math.random()*899));
    }
    if(status==='signed'){
      base.signedAt=new Date(dt.getTime()+3600000).toISOString();
      base.signerName=rand(rnames); base.receiverConfirmName='สมชาย ใจดี';
    }
    docs.push(base);
  }
  // build a couple of reports from signed docs
  const signedByDept = {};
  docs.filter(d=>d.status==='signed').forEach(d=>{ (signedByDept[d.receiverDept]=signedByDept[d.receiverDept]||[]).push(d); });
  Object.keys(signedByDept).slice(0,4).forEach((dep,idx)=>{
    const group = signedByDept[dep].slice(0,5);
    const abbr = deptAbbr(dep);
    const d0 = new Date(group[0].signedAt);
    const dstr = d0.getFullYear()+String(d0.getMonth()+1).padStart(2,'0')+String(d0.getDate()).padStart(2,'0');
    const fileName = abbr+'-'+dstr+'-'+String(idx+1).padStart(3,'0');
    const rep = {id:genId('rpt'), fileName, department:dep, createdAt:group[0].signedAt, receiverName:group[0].signerName, count:group.length, trackings:group.map(x=>x.tracking), thumbs:group.map(x=>x.photo).filter(Boolean).slice(0,12), dataUri:''};
    group.forEach(g=>{ g.reportId=rep.id; g.reportFile=fileName; });
    reports.push(rep);
    if(group[0].type==='internal'){
      mails.push({id:genId('mail'), to:group[0].senderEmpId+'@tidlor.com', cc:state.settings.autoMail.ccList.slice(), subject:'แจ้งการนำส่งเอกสาร '+group[0].tracking, body:'เอกสารได้รับการเซ็นรับเรียบร้อยแล้ว', tracking:group[0].tracking, sentAt:group[0].signedAt, status:'ส่งแล้ว (จำลอง)'});
    }
  });
  // datalog
  const actions=[['Key In','บันทึก 12 ซอง เข้าแผนก '+depts[0].name],['E-Sign','เซ็นรับ 5 รายการ'],['Internal Delivery','สร้างงานจัดส่ง'],['Redelivery','นำส่งใหม่'],['Auto Mail','ส่งเมลอัตโนมัติ'],['Return','นำเข้า Return 2 รายการ']];
  for(let i=0;i<24;i++){ const a=rand(actions); logs.push({id:genId('log'), timestamp:new Date(now.getTime()-i*3600000*3).toISOString(), user:rand(['สมชาย ใจดี','ผู้ดูแลระบบ','ธนกร วงศ์ทอง']), action:a[0], detail:a[1]}); }

  state.documents = docs;
  state.reports = reports;
  state.mails = mails;
  state.datalog = logs;
  persistDocuments(); persistReports(); persistDatalog();
  storageSet('mails', JSON.stringify(mails), true);
  storageSet('seeded','1', true);
}
function loadDemoDataManually(){
  seedDemoData();
  showToast('โหลดข้อมูลตัวอย่างครบทุกเมนูแล้ว 🎉', 'success');
  fireConfetti();
  navigateTo('dashboard');
}
function clearAllData(){
  openModal(
    '<div class="modal-head"><h3>ล้างข้อมูลทั้งหมด</h3><button class="modal-close" onclick="closeModal()">'+ic('x',18)+'</button></div>'+
    '<div class="modal-body"><p>ต้องการลบเอกสาร รายงาน อีเมล และ Datalog ทั้งหมดใช่หรือไม่? การกระทำนี้ย้อนกลับไม่ได้</p></div>'+
    '<div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doClearAllData()">ล้างข้อมูล</button></div>'
  );
}
function doClearAllData(){
  state.documents=[]; state.reports=[]; state.mails=[]; state.datalog=[];
  persistDocuments(); persistReports(); persistDatalog(); storageSet('mails','[]',true);
  closeModal(); navigateTo('dashboard');
  showToast('ล้างข้อมูลเรียบร้อย', 'success');
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  document.getElementById('content').innerHTML = '<div class="empty-state"><div class="es-ic">'+ic('mail',24)+'</div><div class="es-title">กำลังเชื่อมต่อระบบ...</div></div>';
  if(window.storage){ await loadAll(); }
  else { state.storageReady=false; applyTheme(); }
  if(!state.mails){
    const raw = await storageGet('mails', true);
    if(raw){ try{ state.mails = JSON.parse(raw); }catch(e){ state.mails=[]; } } else state.mails=[];
  }
  // restore sidebar collapse
  const col = await storageGet('sidebarCollapsed', false);
  if(col==='1'){ state.ui.sidebarCollapsed=true; }
  // restore Google Sheet endpoint (ฝังถาวร: ใช้ EMBEDDED ก่อน ถ้าไม่มีค่อยใช้ที่เคยบันทึก)
  const savedEp = await storageGet('sheetEndpoint', false);
  const ep = EMBEDDED_SHEET_ENDPOINT || savedEp;
  if(ep){
    state.sheet.endpoint = ep;
    if(EMBEDDED_SHEET_ENDPOINT) storageSet('sheetEndpoint', ep, false);
    testConnection().catch(()=>{}); // auto-connect เงียบๆ ทุกครั้งที่เปิด
  }
  // auto-seed demo data on first run so all features are testable offline
  const seeded = await storageGet('seeded', true);
  if(!seeded && state.documents.length===0){ seedDemoData(); }
  applyTheme();
  // login gate
  if(!state.auth.loggedIn){
    renderLogin();
  } else {
    if(state.ui.sidebarCollapsed) document.getElementById('sidebar').classList.add('collapsed');
    logAction('เข้าสู่ระบบ', state.currentUser.name);
    renderAll();
  }
})();
</script>
