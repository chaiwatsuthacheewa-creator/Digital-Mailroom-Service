<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0E1B3D">
<title>OPS-BSCS Digital Mail Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0E1B3D; --navy-2:#182A63; --navy-3:#24347A;
  --heading:#0E1B3D;
  --ink:#182233; --ink-soft:#5B6478; --ink-faint:#94A0B8;
  --paper:#F1F3F9; --surface:#FFFFFF; --surface-2:#F8FAFF; --line:#E2E6F0; --line-2:#EDEFF5;
  --blue:#2951F5; --blue-deep:#1D3BC4; --blue-soft:#EAF0FE;
  --green:#1C8A5E; --green-soft:#E3F3EC;
  --amber:#C77D22; --amber-soft:#FBEEDD;
  --plum:#6B4FA0; --plum-soft:#EFEAF8;
  --brick:#B23A3A; --brick-soft:#F8E9E9;
  --cyan:#0E8FA8; --cyan-soft:#E0F4F8;
  --pink:#C43C86; --pink-soft:#FBE8F2;
  --sidebar-bg:linear-gradient(180deg,#0E1B3D 0%,#0B1631 100%);
  --table-hover:#FAFBFF;
  --topbar-bg:rgba(255,255,255,.82); --glass-bg:rgba(255,255,255,.9);
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  --shadow-sm:0 1px 2px rgba(14,27,61,.06), 0 1px 3px rgba(14,27,61,.05);
  --shadow-md:0 4px 12px rgba(14,27,61,.06), 0 12px 28px rgba(14,27,61,.08);
  --shadow-lg:0 12px 24px rgba(14,27,61,.10), 0 32px 64px rgba(14,27,61,.18);
  --ring:0 0 0 3px rgba(41,81,245,.16);
  --mono:ui-monospace,SFMono-Regular,'Cascadia Code',Consolas,'Liberation Mono',monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --bottomnav-h:0px;
  --ease:cubic-bezier(.22,.61,.36,1);
}
html[data-theme="dark"]{
  --navy:#C4D0EE; --heading:#EAF0FF;
  --ink:#E6ECF7; --ink-soft:#9AA7C4; --ink-faint:#6B7699;
  --paper:#0A1122; --surface:#131C31; --surface-2:#1A2540; --line:#263250; --line-2:#1E2942;
  --blue:#5B84FF; --blue-deep:#8AA6FF; --blue-soft:#1B2A50;
  --green:#3FCB8E; --green-soft:#123024;
  --amber:#E7A94B; --amber-soft:#33260F;
  --plum:#A98BE0; --plum-soft:#241B3A;
  --brick:#EF6B72; --brick-soft:#331519;
  --cyan:#3DC5DE; --cyan-soft:#0E2A31;
  --pink:#EE73B4; --pink-soft:#331424;
  --sidebar-bg:linear-gradient(180deg,#0C1426 0%,#080E1C 100%);
  --table-hover:#182238;
  --topbar-bg:rgba(15,22,40,.8); --glass-bg:rgba(15,22,40,.88);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:0 18px 48px rgba(0,0,0,.55);
  --ring:0 0 0 3px rgba(91,132,255,.28);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;}
body{
  font-family:'Sarabun','Noto Sans Thai',-apple-system,'Segoe UI',Roboto,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14.5px; line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overscroll-behavior-y:none;
  transition:background .3s ease, color .3s ease;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
button{cursor:pointer;}
h1,h2,h3,h4{margin:0; font-weight:700; color:var(--heading);}
p{margin:0;}
a{color:var(--blue);}
::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#C7CEDE; border-radius:99px;}
:focus-visible{outline:2.5px solid var(--blue); outline-offset:2px; border-radius:4px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh; min-height:100dvh;}
.sidebar{
  width:256px; flex:none; background:var(--navy);
  background:var(--sidebar-bg); color:#C9D2EE;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; height:100dvh; overflow-y:auto;
  transition:transform .32s var(--ease); z-index:60; padding-left:var(--sal);
  -webkit-overflow-scrolling:touch;
}
.sidebar-brand{padding:calc(20px + var(--sat)) 20px 16px; display:flex; align-items:center; gap:11px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{
  width:38px; height:38px; border-radius:11px; background:linear-gradient(135deg,var(--blue),#5B7CFA);
  display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 4px 14px rgba(41,81,245,.45);
}
.brand-text .brand-title{font-size:14.5px; font-weight:700; color:#fff; letter-spacing:.2px;}
.brand-text .brand-sub{font-size:11px; color:#8A94BA; margin-top:1px;}
.sidebar-close{display:none; margin-left:auto; background:rgba(255,255,255,.08); border:none; color:#C9D2EE; width:34px; height:34px; border-radius:9px; align-items:center; justify-content:center;}
.nav-group{padding:14px 12px;}
.nav-label{font-size:10.5px; color:#5E6893; padding:8px 10px 6px; font-weight:700; letter-spacing:.4px;}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:11px;
  color:#B7C0E0; text-decoration:none; font-size:13.8px; font-weight:500; margin-bottom:2px;
  border:none; background:transparent; width:100%; text-align:left; position:relative;
  transition:background .18s ease, color .18s ease;
}
.nav-item svg{flex:none; opacity:.82;}
.nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
.nav-item.active{background:linear-gradient(135deg,var(--blue),#4368F7); color:#fff; box-shadow:0 6px 18px rgba(41,81,245,.4);}
.nav-item.active svg{opacity:1;}
.nav-badge{
  margin-left:auto; background:rgba(255,255,255,.14); color:#fff; font-size:11px; font-weight:700;
  padding:1px 7px; border-radius:99px; min-width:18px; text-align:center;
}
.nav-item.active .nav-badge{background:rgba(255,255,255,.28);}
.sidebar-foot{margin-top:auto; padding:14px 12px calc(18px + var(--sab)); border-top:1px solid rgba(255,255,255,.08);}
.sidebar-backdrop{
  position:fixed; inset:0; background:rgba(9,14,30,.5); backdrop-filter:blur(2px); z-index:55;
  opacity:0; visibility:hidden; transition:opacity .3s ease, visibility .3s ease;
}
.sidebar-backdrop.show{opacity:1; visibility:visible;}
/* collapsed rail (desktop) */
.sidebar{transition:transform .32s var(--ease), width .28s var(--ease);}
.sidebar.collapsed{width:76px;}
.sidebar.collapsed .brand-text, .sidebar.collapsed .nav-item span, .sidebar.collapsed .nav-label, .sidebar.collapsed .nav-badge{opacity:0; width:0; overflow:hidden; display:none;}
.sidebar.collapsed .nav-item{justify-content:center; padding:12px;}
.sidebar.collapsed .sidebar-brand{justify-content:center; padding-left:0; padding-right:0;}
.sidebar.collapsed .sidebar-close{display:none;}
.sidebar.collapsed .sidebar-foot .nav-item span{display:none;}
/* topbar icon buttons */
.icon-btn{width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; transition:all .16s ease;}
.icon-btn:hover{color:var(--blue); border-color:var(--blue); background:var(--blue-soft);}
.icon-btn:active{transform:scale(.94);}
.hide-on-mobile{display:flex;}
@media (max-width:1024px){ .hide-on-mobile{display:none;} }

/* ---------- Network loading bar ---------- */
#net-bar{position:fixed; top:0; left:0; right:0; height:3px; z-index:400; background:transparent; overflow:hidden; pointer-events:none;}
#net-bar::before{content:''; position:absolute; left:-40%; width:40%; height:100%; background:linear-gradient(90deg,transparent,var(--blue),var(--cyan),transparent); opacity:0;}
#net-bar.active::before{opacity:1; animation:net-slide 1.1s linear infinite;}
@keyframes net-slide{0%{left:-40%;}100%{left:100%;}}

/* ---------- Connection pill ---------- */
.conn-pill{display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 12px; border-radius:11px; border:1px solid var(--line); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.conn-pill.conn-ok{color:var(--green); border-color:var(--green); background:var(--green-soft);}
.conn-pill.conn-err{color:var(--brick); border-color:var(--brick); background:var(--brick-soft);}
.conn-pill.conn-wait{color:var(--amber); border-color:var(--amber); background:var(--amber-soft);}
.conn-pill.conn-off{color:var(--ink-faint);}
.conn-pill.conn-wait svg{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.conn-box{border-radius:10px; padding:10px 13px; font-size:13px; display:block;}
.conn-box.ok{background:var(--green-soft); color:var(--green); border:1px solid var(--green);}
.conn-box.err{background:var(--brick-soft); color:var(--brick); border:1px solid var(--brick);}
.conn-box.off{background:var(--paper); color:var(--ink-soft); border:1px solid var(--line);}

/* ---------- Login screen ---------- */
.login-screen{position:fixed; inset:0; z-index:150; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto;}
.login-bg{position:absolute; inset:0; background:linear-gradient(135deg,#0E1B3D,#1D3BC4 55%,#2951F5);}
.login-bg::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 80% 15%,rgba(91,124,250,.6),transparent 45%),radial-gradient(circle at 15% 110%,rgba(18,174,202,.5),transparent 45%);}
.login-card{position:relative; z-index:1; width:100%; max-width:400px; background:var(--surface); border-radius:20px; padding:30px; box-shadow:var(--shadow-lg); animation:modal-pop .3s var(--ease); padding-bottom:calc(30px + var(--sab));}
.login-brand{display:flex; align-items:center; gap:13px; margin-bottom:18px;}
.login-brand .brand-mark{background:linear-gradient(135deg,var(--blue),#5B7CFA);}
.login-title{font-size:22px; font-weight:800; color:var(--heading); letter-spacing:.3px;}
.login-sub{font-size:12.5px; color:var(--ink-faint);}
.login-conn{font-size:12px; font-weight:600; padding:8px 12px; border-radius:9px; margin-bottom:18px; display:flex; align-items:center; gap:7px;}
.login-conn.ok{background:var(--green-soft); color:var(--green);}
.login-conn.off{background:var(--amber-soft); color:var(--amber);}
.login-error{background:var(--brick-soft); color:var(--brick); border-radius:9px; padding:9px 12px; font-size:12.5px; margin-bottom:12px;}
.login-hint{text-align:center; font-size:11.5px; color:var(--ink-faint); margin-top:14px;}

/* ---------- Ripple effect ---------- */
.ripple{position:relative; overflow:hidden;}
.ripple-ink{position:absolute; border-radius:50%; transform:scale(0); background:rgba(255,255,255,.5); animation:ripple-go .6s var(--ease); pointer-events:none;}
@keyframes ripple-go{to{transform:scale(2.6); opacity:0;}}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  min-height:64px; flex:none; background:var(--topbar-bg); backdrop-filter:saturate(1.4) blur(14px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky;
  top:0; z-index:30; padding-top:var(--sat); padding-left:calc(24px + var(--sal)); padding-right:calc(24px + var(--sar));
}
.topbar-title{font-size:18px; font-weight:700; color:var(--navy); letter-spacing:-.2px;}
.topbar-sub{font-size:11.5px; color:var(--ink-faint); font-weight:500; margin-top:-2px;}
.topbar-right{display:flex; align-items:center; gap:14px;}
.menu-toggle{display:none; background:none; border:none; padding:8px; border-radius:9px; color:var(--navy);}
.menu-toggle:active{background:var(--paper);}
.user-chip{
  display:flex; align-items:center; gap:9px; background:var(--paper); border:1px solid var(--line);
  padding:6px 12px 6px 8px; border-radius:99px; font-size:13px;
}
.user-chip .uc-name{max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.user-avatar{
  width:28px; height:28px; border-radius:99px; background:linear-gradient(135deg,var(--blue),#5B7CFA); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; flex:none;
}
.user-chip button{background:none;border:none;color:var(--ink-faint);font-size:12px;text-decoration:underline;padding:0;margin-left:2px;}
.content{padding:24px; flex:1; min-width:0; padding-left:calc(24px + var(--sal)); padding-right:calc(24px + var(--sar)); padding-bottom:calc(24px + var(--bottomnav-h) + var(--sab));}
.view-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.view-head h1{font-size:23px; letter-spacing:-.4px;}
.view-head .view-desc{color:var(--ink-soft); font-size:13.5px; margin-top:4px; max-width:62ch;}
/* view transition */
.view-anim{animation:view-in .34s var(--ease);}
@keyframes view-in{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* ---------- Bottom navigation (mobile) ---------- */
.bottom-nav{
  display:none; position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--glass-bg); backdrop-filter:saturate(1.5) blur(18px);
  border-top:1px solid var(--line); padding-bottom:var(--sab);
  grid-template-columns:repeat(5,1fr); box-shadow:0 -6px 24px rgba(14,27,61,.06);
}
.bn-item{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  padding:9px 4px 7px; background:none; border:none; color:var(--ink-faint); font-size:10.5px; font-weight:600;
  position:relative; min-height:56px;
}
.bn-item svg{width:22px; height:22px;}
.bn-item.active{color:var(--blue);}
.bn-item.active::before{content:''; position:absolute; top:0; left:50%; transform:translateX(-50%); width:26px; height:3px; border-radius:0 0 3px 3px; background:var(--blue);}
.bn-badge{position:absolute; top:5px; right:calc(50% - 22px); background:var(--brick); color:#fff; font-size:9px; font-weight:700; min-width:15px; height:15px; padding:0 3px; border-radius:99px; display:flex; align-items:center; justify-content:center;}

/* ---------- Sticky mobile action bar ---------- */
.sticky-actions{display:contents;}
@media (max-width:760px){
  .sticky-actions{
    display:flex; gap:10px; position:fixed; left:0; right:0;
    bottom:calc(var(--bottomnav-h) + var(--sab)); z-index:45;
    background:rgba(255,255,255,.94); backdrop-filter:blur(14px);
    padding:12px 16px; border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(14,27,61,.06);
  }
  .sticky-actions .btn{flex:1;}
  .has-sticky-actions{padding-bottom:80px;}
}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; font-weight:600; font-size:13.8px;
  padding:10px 16px; border-radius:var(--r-sm); border:1px solid transparent;
  transition:filter .14s ease, transform .08s var(--ease), box-shadow .14s ease;
  white-space:nowrap; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--blue); color:#fff; box-shadow:0 2px 8px rgba(41,81,245,.25);}
.btn-primary:hover{filter:brightness(1.08); box-shadow:0 4px 14px rgba(41,81,245,.32);}
.btn-primary:disabled{background:#B9C4EF; cursor:not-allowed;}
.btn-outline{background:var(--surface); color:var(--ink); border-color:var(--line);}
.btn-outline:hover{border-color:var(--blue); color:var(--blue);}
.btn-ghost{background:transparent; color:var(--ink-soft); border-color:transparent;}
.btn-ghost:hover{background:var(--paper); color:var(--ink);}
.btn-danger{background:var(--brick-soft); color:var(--brick);}
.btn-danger:hover{background:var(--brick); color:#fff;}
.btn-success{background:var(--green); color:#fff;}
.btn-success:hover{filter:brightness(1.08);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn-icon{padding:8px; border-radius:8px;}
.btn-block{width:100%;}

/* ---------- Cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px;}
/* ---------- Dashboard hero ---------- */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; color:#fff; padding:26px 26px; box-shadow:var(--shadow-md);}
.hero-bg{position:absolute; inset:0; background:linear-gradient(120deg,#0E1B3D 0%,#1D3BC4 55%,#2951F5 100%); z-index:0;}
.hero-bg::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 82% 18%, rgba(91,124,250,.55), transparent 42%), radial-gradient(circle at 12% 120%, rgba(18,174,202,.4), transparent 45%);}
.hero-content{position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;}
.hero-greet{font-size:12.5px; font-weight:600; color:#B9C7F5; letter-spacing:.2px;}
.hero-title{font-size:24px; font-weight:700; color:#fff; margin:6px 0 8px; letter-spacing:-.4px;}
.hero-date{font-size:12.5px; color:#C9D4F7; display:flex; align-items:center; gap:6px;}
.hero-pending{text-align:center; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:14px; padding:14px 22px; backdrop-filter:blur(6px);}
.hero-pending-num{font-size:34px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums;}
.hero-pending-lbl{font-size:11.5px; color:#C9D4F7; margin-top:4px;}
/* card & stat interactions */
.stat-card{transition:transform .18s var(--ease), box-shadow .18s ease;}
@media (hover:hover){ .stat-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);} }
.stat-card .stat-ic{background-image:linear-gradient(135deg,rgba(255,255,255,.5),transparent);}
.card-title{font-size:15px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:9px; margin-bottom:16px;}
.card-title .ic-badge{
  width:34px; height:34px; border-radius:10px; background:linear-gradient(135deg,var(--blue),#5B7CFA); color:#fff;
  display:flex; align-items:center; justify-content:center; flex:none; box-shadow:0 4px 10px rgba(41,81,245,.28);
}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}

.stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-md);
  padding:16px 18px; display:flex; flex-direction:column; gap:6px; min-width:0; position:relative; overflow:hidden;
}
.stat-card::after{content:''; position:absolute; right:-30px; top:-30px; width:90px; height:90px; border-radius:99px; opacity:.1; background:currentColor;}
.stat-card .stat-top{display:flex; align-items:center; justify-content:space-between;}
.stat-card .stat-label{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
.stat-card .stat-ic{width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex:none; color:#fff; box-shadow:0 4px 10px rgba(14,27,61,.18);}
.stat-card .stat-value{font-size:28px; font-weight:800; color:var(--heading); font-variant-numeric:tabular-nums;}
.stat-card .stat-sub{font-size:11.5px; color:var(--ink-faint);}
.stat-blue{color:var(--blue); background:linear-gradient(135deg,var(--blue-soft),var(--surface) 60%);} .stat-blue .stat-ic{background:linear-gradient(135deg,var(--blue),#5B7CFA);}
.stat-green{color:var(--green); background:linear-gradient(135deg,var(--green-soft),var(--surface) 60%);} .stat-green .stat-ic{background:linear-gradient(135deg,var(--green),#37C58C);}
.stat-amber{color:var(--amber); background:linear-gradient(135deg,var(--amber-soft),var(--surface) 60%);} .stat-amber .stat-ic{background:linear-gradient(135deg,var(--amber),#E8A94E);}
.stat-plum{color:var(--plum); background:linear-gradient(135deg,var(--plum-soft),var(--surface) 60%);} .stat-plum .stat-ic{background:linear-gradient(135deg,var(--plum),#9B7BDD);}
.stat-brick{color:var(--brick); background:linear-gradient(135deg,var(--brick-soft),var(--surface) 60%);} .stat-brick .stat-ic{background:linear-gradient(135deg,var(--brick),#E56A6F);}
.stat-navy{color:var(--cyan); background:linear-gradient(135deg,var(--cyan-soft),var(--surface) 60%);} .stat-navy .stat-ic{background:linear-gradient(135deg,var(--cyan),#3DC5DE);}

/* ---------- Forms ---------- */
.form-group{margin-bottom:15px;}
.form-row{display:flex; gap:12px;}
.form-row>.form-group{flex:1; min-width:0;}
.form-label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px;}
.form-label .req{color:var(--brick); margin-left:2px;}
.form-hint{font-size:11.5px; color:var(--ink-faint); margin-top:5px; display:flex; align-items:center; gap:5px;}
.input,.select,.textarea{
  width:100%; border:1.5px solid var(--line); background:var(--surface); border-radius:var(--r-sm);
  padding:10px 12px; transition:border-color .14s ease, box-shadow .14s ease; color:var(--ink);
  -webkit-appearance:none;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--blue); outline:none; box-shadow:var(--ring);}
.textarea{resize:vertical; min-height:64px;}
.input-scan-wrap{display:flex; gap:8px; align-items:stretch;}
.input-scan-wrap .input{flex:1;}
.scan-btn{
  flex:none; width:42px; border-radius:var(--r-sm); border:1.5px solid var(--blue-soft); background:var(--blue-soft);
  color:var(--blue-deep); display:flex; align-items:center; justify-content:center;
}
.scan-btn:hover{background:var(--blue); color:#fff;}
.scan-btn.busy{animation:pulse-scan 1s infinite;}
@keyframes pulse-scan{0%,100%{opacity:1;}50%{opacity:.45;}}
.select{appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%235B6478' stroke-width='2.4'><polyline points='6 9 12 15 18 9'/></svg>"); background-repeat:no-repeat; background-position:right 12px center; padding-right:34px;}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-md);}
table{width:100%; border-collapse:collapse; font-size:13.3px;}
th{text-align:left; padding:11px 14px; background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:12px; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:11px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--table-hover);}
.tnum{font-family:var(--mono); font-size:12.6px; color:var(--navy); font-weight:600;}

/* ---------- Badges ---------- */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:99px;}
.badge::before{content:''; width:6px; height:6px; border-radius:99px; background:currentColor;}
.badge-pending{background:var(--amber-soft); color:var(--amber);}
.badge-signed{background:var(--green-soft); color:var(--green);}
.badge-redelivery{background:var(--plum-soft); color:var(--plum);}
.badge-return{background:var(--brick-soft); color:var(--brick);}

/* ---------- Thumbnails ---------- */
.thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; border:1px solid var(--line); cursor:pointer; background:var(--paper);}
.thumb-empty{width:44px; height:44px; border-radius:8px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}

/* ---------- Photo capture box ---------- */
.photo-box{border:1.5px dashed var(--line); border-radius:var(--r-md); padding:16px; display:flex; align-items:center; gap:14px; background:var(--paper);}
.photo-box .photo-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; flex:none; background:var(--surface-2); border:1px solid var(--line);}
.photo-box .photo-placeholder{width:64px; height:64px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--ink-faint); flex:none;}
.photo-box .photo-text{flex:1; min-width:0;}
.photo-box .photo-text .t1{font-weight:600; font-size:13.5px;}
.photo-box .photo-text .t2{font-size:11.5px; color:var(--ink-faint); margin-top:2px;}

/* ---------- Steps / basket ---------- */
.dept-bar{display:flex; align-items:center; gap:14px; background:linear-gradient(120deg,var(--blue-soft),var(--plum-soft)); border:1px solid var(--line); border-radius:var(--r-md); padding:12px 16px; margin-bottom:18px;}
.dept-bar-back{width:38px; height:38px; flex:none; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--blue-deep); display:flex; align-items:center; justify-content:center; transform:rotate(180deg);}
.dept-bar-back:active{transform:rotate(180deg) scale(.94);}
.dept-bar-info{flex:1; min-width:0; display:flex; flex-direction:column;}
.dept-bar-label{font-size:11px; font-weight:600; color:var(--blue-deep); opacity:.75;}
.dept-bar-name{font-size:16px; font-weight:700; color:var(--navy); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.photo-stage{position:relative; border:1.5px dashed var(--line); border-radius:var(--r-md); background:var(--paper); min-height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; transition:border-color .16s ease, background .16s ease;}
.photo-stage:hover{border-color:var(--blue); background:var(--blue-soft);}
.photo-stage-img{width:100%; height:100%; max-height:340px; object-fit:contain;}
.photo-stage-empty{text-align:center; color:var(--ink-faint); padding:24px;}
.photo-stage-empty .t1{font-weight:600; font-size:14px; color:var(--ink-soft); margin-top:10px;}
.photo-stage-empty .t2{font-size:11.5px; margin-top:4px;}
.photo-stage-view{position:absolute; right:10px; bottom:10px; background:rgba(14,20,36,.78); color:#fff; border:none; padding:7px 12px; border-radius:99px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; backdrop-filter:blur(4px);}
.keyin-action{flex-direction:column !important; height:auto !important; padding:13px !important; gap:2px !important;}
.keyin-action small{font-size:11px; font-weight:400; opacity:.8;}
.basket-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; max-height:340px; overflow-y:auto; padding-right:2px;}
.basket-card{display:flex; align-items:center; gap:10px; padding:9px; background:var(--surface); border:1px solid var(--line); border-radius:11px;}
.basket-card-thumb{width:46px; height:46px; flex:none; border-radius:9px; overflow:hidden; cursor:pointer; background:var(--paper); border:1px solid var(--line);}
.basket-card-thumb img{width:100%; height:100%; object-fit:cover;}
.basket-card-noimg{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:var(--ink-faint);}
.basket-card-actions{display:flex; gap:2px; flex:none;}
.step-track{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
.step-dot{display:flex; align-items:center; gap:9px; font-size:12.5px; font-weight:600; color:var(--ink-faint);}
.step-dot .circ{width:24px; height:24px; border-radius:99px; background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center; font-size:12px;}
.step-dot.done .circ{background:var(--green);}
.step-dot.active .circ{background:var(--blue);}
.step-dot.active,.step-dot.done{color:var(--ink);}
.step-line{width:32px; height:2px; background:var(--line);}
.bi-info{flex:1; min-width:0;}
.bi-name{font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--ink);}
.bi-track{font-family:var(--mono); font-size:11.3px; color:var(--ink-soft);}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed; inset:0; background:rgba(14,20,40,.55); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; animation:fade-in .18s ease;}
@keyframes fade-in{from{opacity:0;} to{opacity:1;}}
.modal{background:var(--surface); border-radius:var(--r-lg); width:100%; max-width:560px; max-height:88vh; display:flex; flex-direction:column; box-shadow:var(--shadow-lg); animation:modal-pop .22s var(--ease); overflow:hidden;}
@keyframes modal-pop{from{opacity:0; transform:translateY(12px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);}}
@keyframes sheet-up{from{transform:translateY(100%);} to{transform:translateY(0);}}
.modal.modal-lg{max-width:760px;}
.modal-grab{display:none;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--line);}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:22px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.modal-foot{padding:16px 22px calc(16px + var(--sab)); border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.modal-close{background:none; border:none; color:var(--ink-faint); padding:8px; border-radius:9px;}
.modal-close:active{background:var(--paper); color:var(--ink);}
.modal-plain .modal-body{background:#0e1424;}
.modal-plain .modal-head{background:#0e1424;}
.modal-plain .modal-head h3{color:#fff;}
.modal-plain .modal-close{color:#9AA6C4;}
.img-zoom-wrap{max-height:66vh; overflow:auto; border-radius:12px; -webkit-overflow-scrolling:touch;}
.img-zoom{max-width:100%; max-height:66vh; border-radius:10px; cursor:zoom-in; transition:transform .2s var(--ease); display:block; margin:0 auto;}
.img-zoom.zoomed{max-width:none; max-height:none; width:auto; cursor:zoom-out; transform:scale(1);}

/* ---------- Toast ---------- */
#toast-mount{position:fixed; top:20px; right:20px; z-index:300; display:flex; flex-direction:column; gap:10px;}
.toast{background:var(--navy); color:#fff; padding:12px 16px; border-radius:10px; font-size:13.3px; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; min-width:240px; animation:toast-in .2s ease;}
.toast.toast-error{background:var(--brick);}
.toast.toast-success{background:var(--green);}
@keyframes toast-in{from{opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);}}

/* ---------- Progress + confetti ---------- */
.progress-track{width:100%; height:10px; background:var(--line); border-radius:99px; overflow:hidden; margin:18px 0 6px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--blue),var(--green)); border-radius:99px; width:0%; transition:width .25s ease;}
.confetti-container{position:fixed; inset:0; pointer-events:none; z-index:9999;}
.confetti-piece{position:absolute; width:8px; height:8px; border-radius:2px; animation:confetti-burst 1.15s ease-out forwards;}
@keyframes confetti-burst{0%{transform:translate(0,0) rotate(0deg); opacity:1;}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg); opacity:0;}}

/* ---------- Signature pad ---------- */
.sig-pad-wrap{border:1.5px dashed var(--line); border-radius:var(--r-md); background:var(--surface-2); position:relative;}
.sig-pad-wrap canvas{width:100%; height:170px; display:block; cursor:crosshair; touch-action:none; user-select:none;}
.sig-empty-hint{position:absolute; top:50%; left:0; right:0; text-align:center; transform:translateY(-50%); color:var(--ink-faint); font-size:12.5px; pointer-events:none;}

/* ---------- Misc ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px; overflow-x:auto;}
.tab-btn{padding:11px 16px; background:none; border:none; font-weight:600; font-size:13.3px; color:var(--ink-soft); border-bottom:2.5px solid transparent; white-space:nowrap;}
.tab-btn.active{color:var(--blue); border-bottom-color:var(--blue);}
.empty-state{text-align:center; padding:52px 20px; color:var(--ink-faint);}
.empty-state .es-ic{width:56px; height:56px; border-radius:99px; background:var(--paper); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:var(--ink-faint);}
.empty-state .es-title{font-weight:600; color:var(--ink-soft); font-size:14.5px; margin-bottom:4px;}
.divider{height:1px; background:var(--line); margin:20px 0; border:none;}
.chip-route{display:flex; align-items:center; gap:8px; color:var(--ink-faint); font-size:11.5px; margin:2px 0 14px;}
.chip-route .rline{flex:1; height:0; border-top:2px dashed var(--line-2);}
.info-icon{color:var(--ink-faint); cursor:help;}
.link-external{color:var(--blue); text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:5px;}
.pin-screen{max-width:340px; margin:60px auto; text-align:center;}
.pin-screen .pin-ic{width:60px; height:60px; border-radius:16px; background:var(--blue-soft); color:var(--blue-deep); display:flex; align-items:center; justify-content:center; margin:0 auto 16px;}
.checkbox-cell{width:36px; text-align:center;}
.cb{width:18px; height:18px; accent-color:var(--blue); cursor:pointer;}
.duplicate-warn{background:var(--amber-soft); color:var(--amber); border:1px solid var(--amber); border-radius:9px; padding:9px 12px; font-size:12.5px; display:flex; gap:8px; align-items:flex-start; margin-top:8px;}
.section-title{font-size:12.3px; font-weight:700; color:var(--ink-faint); margin:26px 0 12px; }
.kv-grid{display:grid; grid-template-columns:140px 1fr; gap:9px 14px; font-size:13.3px;}
.kv-grid dt{color:var(--ink-soft);}
.kv-grid dd{margin:0; font-weight:600;}
.color-swatch{width:36px; height:36px; border-radius:9px; border:1px solid var(--line); cursor:pointer; padding:0;}
.mode-switch{display:inline-flex; background:var(--paper); border:1px solid var(--line); border-radius:11px; padding:4px; gap:4px;}
.mode-opt{display:flex; align-items:center; gap:7px; padding:9px 16px; border:none; background:transparent; border-radius:8px; font-weight:600; font-size:13px; color:var(--ink-soft);}
.mode-opt.active{background:var(--surface); color:var(--blue); box-shadow:var(--shadow-sm);}
.dept-row{display:flex; align-items:center; gap:8px; padding:9px 11px; border:1px solid var(--line); border-radius:9px; margin-bottom:7px;}
.dept-row input{border:none; background:transparent; flex:1; font-weight:500;}
.dept-row input:focus{outline:none;}
.qr-box{display:flex; flex-direction:column; align-items:center; gap:12px; padding:18px;}
.print-only{display:none;}
/* ===== Tablet / iPad landscape (keep sidebar, roomy) ===== */
@media (max-width:1180px){
  .grid-3{grid-template-columns:1fr 1fr;}
}
/* ===== iPad portrait & small laptops: collapse sidebar to drawer ===== */
@media (max-width:1024px){
  .sidebar{position:fixed; left:0; top:0; transform:translateX(-100%); box-shadow:var(--shadow-lg); width:290px;}
  .sidebar.open{transform:translateX(0);}
  .sidebar-close{display:flex;}
  .menu-toggle{display:flex; align-items:center;}
  .content{max-width:900px; margin:0 auto; width:100%;}
}
/* ===== Phones ===== */
@media (max-width:760px){
  :root{--bottomnav-h:64px;}
  .grid-2,.grid-3{grid-template-columns:1fr; gap:14px;}
  .form-row{flex-direction:column; gap:0;}
  .content{padding:16px; padding-bottom:calc(16px + var(--bottomnav-h) + var(--sab));}
  .topbar{padding-left:calc(14px + var(--sal)); padding-right:calc(14px + var(--sar));}
  .view-head h1{font-size:20px;}
  .view-head{margin-bottom:16px;}
  .user-chip .uc-name{max-width:96px;}
  .user-chip button{display:none;}
  .card{padding:16px; border-radius:14px;}
  .bottom-nav{display:grid;}
  .stat-card .stat-value{font-size:24px;}
  .basket-grid{grid-template-columns:1fr;}
  .dept-bar-name{font-size:15px;}
  .hero{padding:20px;}
  .hero-title{font-size:20px;}
  .hero-content{flex-direction:column; align-items:flex-start;}
  .hero-pending{width:100%; display:flex; align-items:center; gap:14px; text-align:left;}
  .hero-pending-lbl{margin-top:0;}
  .hero-pending .btn{margin-top:0 !important; margin-left:auto;}
  /* Bottom-sheet modals */
  .modal-overlay{padding:0; align-items:flex-end;}
  .modal, .modal.modal-lg{max-width:100%; max-height:92vh; border-radius:20px 20px 0 0; animation:sheet-up .3s var(--ease);}
  .modal-grab{display:block; width:38px; height:4px; border-radius:99px; background:var(--line); margin:9px auto 2px;}
  .modal-body{padding:18px;}
  .modal-head{padding:8px 18px 14px;}
  .modal-foot{flex-direction:column-reverse;}
  .modal-foot .btn{width:100%;}
  .tabs{gap:2px;}
  .tab-btn{padding:11px 12px;}
  /* full-width primary actions feel */
  .table-wrap{border-radius:12px;}
  th,td{padding:10px 11px;}
  .toast{min-width:auto; max-width:calc(100vw - 32px);}
  #toast-mount{top:calc(12px + var(--sat)); right:16px; left:16px;}
}
@media (max-width:400px){
  .bn-item{font-size:9.5px;}
  .bn-item svg{width:20px; height:20px;}
}
@media print{
  body *{visibility:hidden;}
  .print-only, .print-only *{visibility:visible;}
  .print-only{display:block; position:absolute; top:0; left:0; width:100%; padding:24px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}
@media (hover:hover){
  .nav-item:hover{background:rgba(255,255,255,.06);}
}
</style>

/* ---------------- Storage helpers ---------------- */
async function storageGet(key, shared){
  try{
    const r = await window.storage.get(key, !!shared);
    return r ? r.value : null;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared){
  try{
    await window.storage.set(key, value, !!shared);
    return true;
  }catch(e){ return false; }
}

async function loadAll(){
  try{
    const [docsRaw, logRaw, settRaw, meRaw, rptRaw] = await Promise.all([
      storageGet('documents', true),
      storageGet('datalog', true),
      storageGet('settings', true),
      storageGet('me', false),
      storageGet('reports', true),
    ]);
    if(docsRaw){ try{ state.documents = JSON.parse(docsRaw); }catch(e){} }
    if(logRaw){ try{ state.datalog = JSON.parse(logRaw); }catch(e){} }
    if(rptRaw){ try{ state.reports = JSON.parse(rptRaw); }catch(e){} }
    if(settRaw){ try{ state.settings = Object.assign(defaultSettings(), JSON.parse(settRaw)); }catch(e){} }
    if(meRaw){ try{ state.currentUser = JSON.parse(meRaw); }catch(e){} }
    state.storageReady = true;
  }catch(e){
    state.storageReady = false;
    showToast('ไม่สามารถเชื่อมต่อระบบจัดเก็บข้อมูลได้ ข้อมูลจะไม่ถูกบันทึกถาวร', 'error');
  }
  applyTheme();
}

/* ============================================================
   GOOGLE SHEET API LAYER (via Apps Script Web App)
   ============================================================ */
function setNetStatus(status, err){
  state.sheet.status = status;
  state.sheet.lastError = err||'';
  state.sheet.connected = (status==='connected');
  renderConnStatus();
}
function showNetBar(on){
  const bar = document.getElementById('net-bar'); if(!bar) return;
  if(on){ state.sheet.busy++; bar.classList.add('active'); }
  else { state.sheet.busy=Math.max(0,state.sheet.busy-1); if(state.sheet.busy===0) bar.classList.remove('active'); }
}
async function api(action, payload, opts){
  opts = opts||{};
  const url = state.sheet.endpoint;
  if(!url){ throw new Error('ยังไม่ได้ตั้งค่า Web App URL'); }
  if(!opts.silent) showNetBar(true);
  try{
    const body = Object.assign({action:action}, payload||{});
    const res = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'}, // text/plain = ไม่มี CORS preflight
      body: JSON.stringify(body),
      redirect:'follow'
    });
    const text = await res.text();
    let data; try{ data = JSON.parse(text); }catch(e){ throw new Error('ตอบกลับไม่ใช่ JSON (ตรวจการ Deploy / สิทธิ์ Anyone)'); }
    if(!data.ok){ throw new Error(data.error||'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์'); }
    return data;
  } finally { if(!opts.silent) showNetBar(false); }
}

/* image/pdf fields ตัดออกก่อนส่งขึ้น Sheet ถ้าใหญ่เกินลิมิตเซลล์ */
const SHEET_CELL_LIMIT = 45000;
function sheetSafeDoc(d){
  const c = Object.assign({}, d);
  if(c.photo && c.photo.length>SHEET_CELL_LIMIT) c.photo='';
  if(c.signature && c.signature.length>SHEET_CELL_LIMIT) c.signature='';
  return c;
}
function reportsForSheet(){
  return (state.reports||[]).map(r=>({ id:r.id, fileName:r.fileName, department:r.department, createdAt:r.createdAt, receiverName:r.receiverName, count:r.count, trackings:(r.trackings||[]) }));
}
let _syncTimers={};
function syncTable(table, rows){
  if(!state.sheet.connected) return;
  const payloadRows = table==='Documents' ? rows.map(sheetSafeDoc) : rows;
  clearTimeout(_syncTimers[table]);
  _syncTimers[table] = setTimeout(()=>{
    api('replaceAll', {table:table, rows:payloadRows}, {silent:true})
      .then(()=>{ /* synced */ })
      .catch(e=>{ setNetStatus('error', e.message); });
  }, 400);
}

async function testConnection(){
  try{
    setNetStatus('connecting');
    const data = await api('ping');
    state.sheet.info = data;
    setNetStatus('connected');
    storageSet('sheetEndpoint', state.sheet.endpoint, false);
    return data;
  }catch(e){ setNetStatus('error', e.message); throw e; }
}
async function pullAllFromSheet(){
  if(!state.sheet.connected) return false;
  try{
    const data = await api('getAll');
    if(Array.isArray(data.documents)) state.documents = data.documents;
    if(Array.isArray(data.reports)) state.reports = data.reports;
    if(Array.isArray(data.mails)) state.mails = data.mails;
    if(Array.isArray(data.datalog)) state.datalog = data.datalog;
    if(data.settings) state.settings = Object.assign(defaultSettings(), data.settings);
    storageSet('documents', JSON.stringify(state.documents), true);
    storageSet('reports', JSON.stringify(state.reports), true);
    storageSet('mails', JSON.stringify(state.mails||[]), true);
    storageSet('datalog', JSON.stringify(state.datalog), true);
    return true;
  }catch(e){ setNetStatus('error', e.message); return false; }
}

async function doLogin(){
  const user = (document.getElementById('login-user').value||'').trim();
  const pass = (document.getElementById('login-pass').value||'');
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  if(!user){ errEl.style.display='block'; errEl.textContent='กรุณากรอกชื่อผู้ใช้'; return; }
  if(!state.sheet.endpoint){ errEl.style.display='block'; errEl.textContent='ยังไม่ได้เชื่อมต่อ Google Sheet — กดปุ่มด้านล่างเพื่อตั้งค่า หรือเข้าโหมดทดลอง'; return; }
  btn.disabled=true; btn.innerHTML=ic('refresh',16)+' กำลังตรวจสอบ...';
  try{
    if(!state.sheet.connected){ await testConnection(); }
    const res = await api('login', {username:user, password:pass});
    state.currentUser = {name:res.user.name, empId:res.user.empId||''};
    state.isSuperAdmin = (res.user.role==='superadmin');
    state.auth = {loggedIn:true, mode:'sheet'};

/* ---------------- Utils ---------------- */
function genId(prefix){ return (prefix||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isoDatePart(iso){ return (iso||'').slice(0,10); }
function formatDateTimeTH(iso){ if(!iso) return '-'; const d=new Date(iso); return d.toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function deptByName(name){ return state.settings.departments.find(d=>d.name===name); }
function deptAbbr(name){ const d=deptByName(name); return d?d.abbr:'GEN'; }
function buildingByName(name){ return state.settings.buildings.find(b=>b.name===name); }

function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(/\s+/);
  return (parts[0]?parts[0][0]:'') .toUpperCase();
}

function fireConfetti(){
  const container = document.createElement('div');

  document.body.appendChild(container);
  const colors = ['#2951F5','#1C8A5E','#C77D22','#6B4FA0','#B23A3A','#5B7CFA'];
  for(let i=0;i<64;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = (44 + Math.random()*12)+'%';
    p.style.top = '38%';

/* ---------------- Image helpers ---------------- */
function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w>h && w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h>=w && h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.55));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------------- Modal system ---------------- */
let modalStack = [];
function openModal(html, opts){
  opts = opts||{};
  const mount = document.getElementById('modal-mount');
  const grab = html.indexOf('modal-grab')>=0 ? '' : '<div class="modal-grab"></div>';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal'+(opts.large?' modal-lg':'')+(opts.plain?' modal-plain':'')+'">'+grab+html+'</div>';
  mount.appendChild(overlay);
  modalStack.push(opts);
  if(!opts.persistent){
    const handler = function(e){ if(e.target===overlay) closeModal(); };
    overlay.addEventListener('mousedown', handler);
    overlay.addEventListener('touchstart', handler, {passive:true});
  }
  document.body.style.overflow='hidden';
  return overlay;
}
function closeModal(){
  const mount = document.getElementById('modal-mount');
  if(mount.lastElementChild){ mount.removeChild(mount.lastElementChild); modalStack.pop(); }
  if(!mount.childElementCount){ document.body.style.overflow=''; }
}
function closeAllModals(){ document.getElementById('modal-mount').innerHTML=''; modalStack=[]; document.body.style.overflow=''; }
document.addEventListener('keydown', function(e){ if(e.key==='Escape'){ const m=document.getElementById('modal-mount'); if(m&&m.childElementCount){ closeModal(); } else if(state.ui.sidebarOpen){ closeSidebar(); } } });
document.addEventListener('pointerdown', function(e){
  const btn = e.target.closest('.ripple, .btn');
  if(!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const ink = document.createElement('span');
  ink.className='ripple-ink';
  ink.style.width=ink.style.height=size+'px';
  ink.style.left=(e.clientX-rect.left-size/2)+'px';
  ink.style.top=(e.clientY-rect.top-size/2)+'px';
  if(getComputedStyle(btn).position==='static') btn.style.position='relative';
  const prevOverflow = btn.style.overflow; btn.style.overflow='hidden';
  btn.appendChild(ink);
  setTimeout(()=>{ ink.remove(); }, 600);
});

/* ============================================================
   Dashboard
   ============================================================ */
function computeDashboardStats(){
  const now = new Date();
  const period = state.ui.dashboardPeriod;
  function inPeriod(iso){
    const d = new Date(iso);
    if(period==='week'){ const diffDays=(now-d)/86400000; return diffDays>=0 && diffDays<7; }
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  const todayStr = todayISO();
  return {
    total: state.documents.filter(d=>inPeriod(d.createdAt)).length,
    pickup: state.documents.filter(d=>d.type==='keyin' && isoDatePart(d.createdAt)===todayStr).length,
    interoffice: state.documents.filter(d=>d.type==='internal' && inPeriod(d.createdAt)).length,
    pending: state.documents.filter(d=>d.status==='pending').length,
    redelivery: state.documents.filter(d=>d.status==='redelivery').length,
    ret: state.documents.filter(d=>d.status==='return').length,
  };
}
function dashboardTrendData(){
  const now = new Date();
  const days = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const counts = new Array(days).fill(0);
  state.documents.forEach(d=>{
    const dt = new Date(d.createdAt);
    if(dt.getFullYear()===now.getFullYear() && dt.getMonth()===now.getMonth()) counts[dt.getDate()-1]++;
  });
  return counts;
}
function renderTrendChartSvg(){
  const counts = dashboardTrendData();
  const max = Math.max(1, ...counts);
  const w=760,h=180,padL=6,padR=6,padT=10,padB=22;
  const n = counts.length;
  const gap = (w-padL-padR)/n;
  const bw = gap*0.6;
  const todayIdx = new Date().getDate()-1;
  let bars='', labels='';
  counts.forEach((c,i)=>{
    const bh = (c/max)*(h-padT-padB);
    const x = padL+i*gap+(gap-bw)/2;
    const y = h-padB-bh;
    bars += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(bh, c>0?2:0).toFixed(1)+'" rx="2" fill="'+(i===todayIdx?'var(--blue)':'var(--line)')+'"><title>วันที่ '+(i+1)+': '+c+' รายการ</title></rect>';
    if(i%Math.ceil(n/8)===0){
      labels += '<text x="'+(padL+i*gap+gap/2).toFixed(1)+'" y="'+(h-6)+'" font-size="9.5" fill="#94A0B8" text-anchor="middle">'+(i+1)+'</text>';
    }
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="width:100%;height:180px;">'+bars+labels+'</svg>';
}
function computeDeptSummary(){
  const now = new Date();
  const period = state.ui.dashboardPeriod;
  function inPeriod(iso){
    const d = new Date(iso);
    if(period==='week'){ const diffDays=(now-d)/86400000; return diffDays>=0 && diffDays<7; }
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  }
  const map = {};
  state.documents.forEach(d=>{
    if(!inPeriod(d.createdAt)) return;
    const key = d.receiverDept || 'ไม่ระบุแผนก';
    if(!map[key]) map[key] = {name:key, total:0, signed:0, pending:0};
    map[key].total++;
    if(d.status==='signed') map[key].signed++;
    if(d.status==='pending') map[key].pending++;
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function setDashboardPeriod(p){ state.ui.dashboardPeriod=p; renderAll(); }

AFTER_RENDER.dashboard = function(){ animateCounts(); };
function animateCounts(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target = parseInt(el.getAttribute('data-count'),10)||0;
    if(target===0){ el.textContent='0'; return; }
    const dur = 700, t0 = performance.now();
    function step(t){
      const p = Math.min(1,(t-t0)/dur);
      const eased = 1-Math.pow(1-p,3);
      el.textContent = Math.round(target*eased).toLocaleString();
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

/* ============================================================
   KEY IN
   ============================================================ */
function countHistory(trackingNumber){
  if(!trackingNumber) return {redelivery:0, return:0, found:false};
  let rd=0, rt=0, found=false;
  state.documents.forEach(d=>{
    if(d.tracking && d.tracking===trackingNumber){
      found = true;
      rd += (d.redeliveryCount||0);
      rt += (d.returnCount||0);
    }
  });
  return {redelivery:rd, return:rt, found};
}

function onTrackingInput(val){
  state.ui.keyin.form.tracking = val;
  const t = val.trim();
  state.ui.keyin.dupWarn = t ? countHistory(t) : null;
  // re-render only the warning area to avoid losing focus: light refresh
  const wrap = document.querySelector('.duplicate-warn');
  const dup = state.ui.keyin.dupWarn;
  const parent = document.getElementById('keyin-tracking').closest('.form-group');
  const existing = parent.querySelector('.duplicate-warn');
  if(existing) existing.remove();
  if(dup && dup.found){

async function runOcr(input){
  if(!input.files||!input.files[0]) return;
  const status = document.getElementById('ocr-status');
  status.style.display='block'; status.textContent='กำลังเตรียมรูป...';
  try{
    const dataUrl = await compressImageFile(input.files[0], 1400, 0.9);
    document.getElementById('ocr-img').src = dataUrl;
    document.getElementById('ocr-preview').style.display='block';
    status.textContent='กำลังอ่านข้อความ... (ครั้งแรกอาจใช้เวลาสักครู่)';
    const result = await Tesseract.recognize(dataUrl, 'tha+eng', {
      logger: m=>{ if(m.status==='recognizing text'){ status.textContent='กำลังอ่านข้อความ... '+Math.round(m.progress*100)+'%'; } }
    });
    const raw = (result.data.text||'').replace(/[^\u0E00-\u0E7Fa-zA-Z0-9 \n]/g,' ');
    const tokens = raw.split(/\s+/).map(t=>t.trim()).filter(t=>t.length>0);
    status.style.display='none';
    renderOcrTokens(tokens);
  }catch(e){
    status.textContent='ไม่สามารถอ่านข้อความได้ ลองใหม่อีกครั้ง';
  }
}
let ocrSelected = [];
function renderOcrTokens(tokens){
  ocrSelected = [];
  const box = document.getElementById('ocr-tokens');
  const uniq = tokens.slice(0,40);
  box.innerHTML = uniq.map((t,i)=>'<button class="btn btn-outline btn-sm ocr-token" data-idx="'+i+'" onclick="toggleOcrToken('+i+',\''+escapeHtml(t).replace(/'/g,"\\'")+'\')">'+escapeHtml(t)+'</button>').join('');
  document.getElementById('ocr-result').style.display='block';
  document.getElementById('ocr-use-btn').style.display='inline-flex';
  // auto-guess: pick first 1-2 Thai/long tokens (drop honorifics)
  const honorifics = ['นาย','นาง','นางสาว','น.ส.','คุณ','ด.ช.','ด.ญ.','Mr','Mrs','Ms','Miss'];
  const cand = uniq.filter(t=>!honorifics.includes(t) && t.length>=2).slice(0,2);
  document.getElementById('ocr-composed').value = cand.join(' ');
}
function toggleOcrToken(idx, text){
  const btn = document.querySelector('.ocr-token[data-idx="'+idx+'"]');
  const pos = ocrSelected.indexOf(idx);
  if(pos>=0){ ocrSelected.splice(pos,1); btn.classList.remove('btn-primary'); btn.classList.add('btn-outline'); }
  else { ocrSelected.push(idx); btn.classList.add('btn-primary'); btn.classList.remove('btn-outline'); }
  const words = ocrSelected.map(i=>document.querySelector('.ocr-token[data-idx="'+i+'"]').textContent);
  document.getElementById('ocr-composed').value = words.join(' ');
}
function copyComposed(){

let qrScanStream=null, qrScanRAF=null;
function openQrScanModal(){
  syncKeyinForm();
  openModal(
    '<div class="modal-head"><h3>สแกน QR Code / Barcode</h3><button class="modal-close" onclick="closeQrScan()">'+ic('x',18)+'</button></div>'+
    '<div class="modal-body">'+
      '<div style="position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:4/3;">'+
        '<video id="qr-video" playsinline style="width:100%;height:100%;object-fit:cover;"></video>'+
        '<div style="position:absolute;inset:18%;border:2.5px solid rgba(255,255,255,.85);border-radius:12px;"></div>'+
      '</div>'+
      '<div id="qr-status" style="text-align:center;color:var(--ink-soft);font-size:12.5px;padding:10px;">กำลังเปิดกล้อง...</div>'+
      '<div style="text-align:center;color:var(--ink-faint);font-size:11.5px;">หากไม่มีกล้อง ให้อัปโหลดรูป QR หรือพิมพ์เลขเองในช่อง Tracking</div>'+
      '<label class="btn btn-outline btn-block" style="margin-top:10px;">'+ic('image',16)+' อัปโหลดรูป QR/Barcode'+
        '<input type="file" accept="image/*" style="display:none;" onchange="scanQrFromFile(this)"></label>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn btn-outline" onclick="closeQrScan()">ยกเลิก</button></div>',
    {persistent:true}
  );
  startQrCamera();
}
async function startQrCamera(){
  const video = document.getElementById('qr-video');
  const status = document.getElementById('qr-status');
  try{
    qrScanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject = qrScanStream;
    video.setAttribute('playsinline','');
    await video.play();
    // Prefer native BarcodeDetector (supports real 1D barcodes: code_128/39, ean_13, data_matrix, qr)
    let detector = null;
    if('BarcodeDetector' in window){
      try{ detector = new window.BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','ean_8','upc_a','data_matrix','itf','codabar']}); }catch(e){ detector=null; }
    }
    status.textContent = detector ? 'เล็ง QR / Barcode ให้อยู่ในกรอบ (รองรับบาร์โค้ดพัสดุ)' : 'เล็ง QR Code ให้อยู่ในกรอบ';
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', {willReadFrequently:true});
    async function tick(){
      if(!qrScanStream){ return; }
      if(video.readyState===video.HAVE_ENOUGH_DATA){
        if(detector){
          try{
            const codes = await detector.detect(video);
            if(codes && codes[0] && codes[0].rawValue){ onQrDetected(codes[0].rawValue); return; }
          }catch(e){}
        } else {
          canvas.width = video.videoWidth; canvas.height = video.videoHeight;
          ctx.drawImage(video,0,0,canvas.width,canvas.height);
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if(code && code.data){ onQrDetected(code.data); return; }
        }
      }
      qrScanRAF = requestAnimationFrame(tick);
    }
    qrScanRAF = requestAnimationFrame(tick);
  }catch(e){
    status.textContent = 'ไม่สามารถเปิดกล้องได้ — กรุณาอัปโหลดรูป QR หรือพิมพ์เลขเอง';
  }
}
async function scanQrFromFile(input){
  if(!input.files||!input.files[0]) return;
  const status = document.getElementById('qr-status');
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width=img.width; canvas.height=img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const data = ctx.getImageData(0,0,canvas.width,canvas.height);
      const code = jsQR(data.data, data.width, data.height);
      if(code && code.data){ onQrDetected(code.data); }
      else { status.textContent='ไม่พบ QR Code ในรูปนี้ ลองรูปอื่น'; }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}
function onQrDetected(data){
  const val = String(data).trim();
  state.ui.keyin.form.tracking = val;
  state.ui.keyin.dupWarn = countHistory(val);
  closeQrScan();
  renderAll();
  showToast('สแกนเลขพัสดุสำเร็จ: '+val, 'success');
}
function closeQrScan(){
  if(qrScanRAF){ cancelAnimationFrame(qrScanRAF); qrScanRAF=null; }
  if(qrScanStream){ qrScanStream.getTracks().forEach(t=>t.stop()); qrScanStream=null; }
  closeModal();
}

function generateTracking(buildingName){
  const b = buildingByName(buildingName) || state.settings.buildings[0];
  const prefix = state.settings.trackingPrefix + (b?b.code:'01');
  const dept = state.ui.internal.form.senderDept;
  const abbr = dept ? deptAbbr(dept) : 'GEN';
  const d = new Date();
  const dateStr = d.getFullYear().toString().slice(2)+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  // sequence = count of internal docs today +1
  const todayCount = state.documents.filter(x=>x.type==='internal' && isoDatePart(x.createdAt)===todayISO()).length + 1;
  const seq = String(todayCount).padStart(3,'0');
  return prefix+'-'+abbr+'-'+dateStr+'-'+seq;
}

let sigCtx=null, sigDrawing=false, sigHasInk=false;
AFTER_RENDER.esign = function(){
  const canvas = document.getElementById('sig-pad');
  if(!canvas) return;
  const ratio = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*ratio; canvas.height = 170*ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.6; sigCtx.lineCap='round'; sigCtx.lineJoin='round'; sigCtx.strokeStyle='#173662';
  sigHasInk=false; state.ui.esign.signatureEmpty=true;
  const pos = ev=>{ const r=canvas.getBoundingClientRect(); return {x:(ev.clientX-r.left), y:(ev.clientY-r.top)}; };
  canvas.addEventListener('pointerdown', ev=>{
    ev.preventDefault(); sigDrawing=true;
    try{ canvas.setPointerCapture(ev.pointerId); }catch(e){}
    const p=pos(ev); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y);
    if(!sigHasInk){ sigHasInk=true; state.ui.esign.signatureEmpty=false; const h=document.getElementById('sig-hint'); if(h) h.style.display='none'; }
  });
  canvas.addEventListener('pointermove', ev=>{ if(!sigDrawing) return; ev.preventDefault(); const p=pos(ev); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); });
  canvas.addEventListener('pointerup', ()=>sigDrawing=false);
  canvas.addEventListener('pointercancel', ()=>sigDrawing=false);
  canvas.addEventListener('pointerleave', ()=>sigDrawing=false);
};
function clearSignature(){
  const canvas=document.getElementById('sig-pad'); if(!canvas||!sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHasInk=false; state.ui.esign.signatureEmpty=true;
  const h=document.getElementById('sig-hint'); if(h) h.style.display='block';
}

/* PDF builder — returns a jsPDF object (reused by save + preview) */
function buildPdf(docs, receiverName, sigData, fileName){
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4'});
    const PW = 210, MX = 14, CW = PW - MX*2;
    const first = docs[0];
    function header(){
      pdf.setFillColor(14,27,61); pdf.rect(0,0,PW,26,'F');
      pdf.setTextColor(255); pdf.setFont('helvetica','bold'); pdf.setFontSize(14);
      pdf.text('OPS-BSCS Digital Mail Service', MX, 12);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(190,205,240);
      pdf.text('Delivery Receipt / Proof of Sign', MX, 19);
      pdf.setFontSize(11); pdf.setTextColor(255); pdf.setFont('helvetica','bold');
      pdf.text(fileName, PW-MX, 12, {align:'right'});
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(190,205,240);
      pdf.text(formatDateTimeTH(first.signedAt), PW-MX, 19, {align:'right'});
    }
    header();
    // meta box
    let y = 34;
    pdf.setDrawColor(220); pdf.setFillColor(247,249,253); pdf.roundedRect(MX, y, CW, 22, 2, 2, 'FD');
    pdf.setFontSize(8.5); pdf.setTextColor(120);
    pdf.text('DEPARTMENT', MX+4, y+6); pdf.text('RECEIVER', MX+4, y+14);
    pdf.text('CONFIRMED BY (LOGIN)', MX+95, y+6); pdf.text('TOTAL ENVELOPES', MX+95, y+14);
    pdf.setFontSize(10); pdf.setTextColor(30); pdf.setFont('helvetica','bold');
    pdf.text(String(first.receiverDept||'-'), MX+4, y+10);
    pdf.text(String(receiverName||'-'), MX+4, y+18);
    pdf.text(String(state.currentUser.name||'-'), MX+95, y+10);
    pdf.text(String(docs.length)+' envelope(s)', MX+95, y+18);
    pdf.setFont('helvetica','normal');
    y += 30;

    // table header
    const cols = {no:MX, thumb:MX+8, sender:MX+30, tracking:MX+92, qty:MX+150, remark:MX+162};
    function tableHead(){
      pdf.setFillColor(234,240,254); pdf.rect(MX, y, CW, 8, 'F');
      pdf.setFontSize(8.5); pdf.setTextColor(40,60,120); pdf.setFont('helvetica','bold');
      pdf.text('#', cols.no+1, y+5.4);
      pdf.text('Image', cols.thumb+1, y+5.4);
      pdf.text('Sender', cols.sender, y+5.4);
      pdf.text('Tracking', cols.tracking, y+5.4);
      pdf.text('Qty', cols.qty, y+5.4);
      pdf.text('Remark', cols.remark, y+5.4);
      pdf.setFont('helvetica','normal'); pdf.setTextColor(30);
      y += 8;
    }
    tableHead();
    const rowH = 16;
    for(let i=0;i<docs.length;i++){
      const doc = docs[i];
      if(y + rowH > 274){ pdf.addPage(); y=16; header?header():0; y=20; tableHead(); }
      // row separator
      pdf.setDrawColor(232); pdf.line(MX, y+rowH, MX+CW, y+rowH);
      const cy = y + rowH/2;
      pdf.setFontSize(9); pdf.setTextColor(60);
      pdf.text(String(i+1), cols.no+1, cy+1);
      // thumbnail
      if(doc.photo){
        try{ pdf.addImage(doc.photo, 'JPEG', cols.thumb, y+2, 18, 12); }
        catch(e){ try{ pdf.addImage(doc.photo,'PNG',cols.thumb,y+2,18,12);}catch(e2){} }
        pdf.setDrawColor(210); pdf.rect(cols.thumb, y+2, 18, 12);
      } else {
        pdf.setDrawColor(220); pdf.setFillColor(245,247,251); pdf.rect(cols.thumb, y+2, 18, 12, 'FD');
        pdf.setFontSize(6); pdf.setTextColor(160); pdf.text('no image', cols.thumb+9, y+8.6, {align:'center'});
      }
      pdf.setFontSize(9); pdf.setTextColor(40);
      const sender = pdf.splitTextToSize(String(doc.senderName||'-'), cols.tracking-cols.sender-3);
      pdf.text(sender.slice(0,2), cols.sender, cy-1);
      pdf.setFontSize(8.5); pdf.setTextColor(20,50,120);
      pdf.text(String(doc.tracking||'-'), cols.tracking, cy+1);
      pdf.setTextColor(60); pdf.setFontSize(9);
      pdf.text(String(doc.quantity||1), cols.qty+2, cy+1);
      const rmk = pdf.splitTextToSize(String(doc.remark||'-'), MX+CW-cols.remark-2);
      pdf.setFontSize(7.5); pdf.setTextColor(110);
      pdf.text(rmk.slice(0,2), cols.remark, cy-1);
      y += rowH;
    }
    // signature block
    y += 8;
    if(y > 250){ pdf.addPage(); y=24; }
    pdf.setDrawColor(200); pdf.setFontSize(9); pdf.setTextColor(90);
    pdf.text('Receiver signature', MX, y);
    pdf.roundedRect(MX, y+2, 80, 26, 2, 2);
    if(sigData){ try{ pdf.addImage(sigData, 'PNG', MX+4, y+4, 72, 22); }catch(e){} }
    pdf.setFontSize(10); pdf.setTextColor(30); pdf.setFont('helvetica','bold');
    pdf.text(String(receiverName||'-'), MX, y+34);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(120);
    pdf.text('Signed at '+formatDateTimeTH(first.signedAt), MX, y+39);

    // footer page numbers
    const pageCount = pdf.internal.getNumberOfPages();
    for(let p=1;p<=pageCount;p++){ pdf.setPage(p); pdf.setFontSize(7.5); pdf.setTextColor(160); pdf.text('OPS-BSCS Digital Mail Service • '+fileName+' • Page '+p+'/'+pageCount, PW/2, 290, {align:'center'}); }
    return pdf;
}

async function generateSignPdf(docs, receiverName, sigData){
  if(!docs.length) return;
  try{
    const first = docs[0];
    const abbr = deptAbbr(first.receiverDept);
    const d = new Date();
    const dateStr = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    const seq = String((state.reports? state.reports.length:0)+1).padStart(3,'0');
    const fileName = abbr+'-'+dateStr+'-'+seq;
    const pdf = buildPdf(docs, receiverName, sigData, fileName);
    const dataUri = pdf.output('datauristring');
    const report = {
      id: genId('rpt'), fileName, department:first.receiverDept, createdAt: first.signedAt,
      receiverName, count:docs.length, trackings:docs.map(x=>x.tracking),
      thumbs: docs.map(x=>x.photo).filter(Boolean).slice(0,12), signature: sigData||'', dataUri
    };
    if(!state.reports) state.reports = [];
    state.reports.unshift(report);
    docs.forEach(doc=>{ doc.reportId = report.id; doc.reportFile = fileName; });
    persistReports();
    persistDocuments();
  }catch(e){ console.error(e); }
}

/* หา document ที่อยู่ในรายงานนี้ (สำหรับ regenerate) */
function getReportDocs(report){
  let docs = (state.documents||[]).filter(d=>d.reportId===report.id);
  if(!docs.length && report.trackings && report.trackings.length){
    const set = {}; (report.trackings||[]).forEach(t=>set[t]=1);
    docs = (state.documents||[]).filter(d=>set[d.tracking]);
  }
  return docs;
}
/* สร้าง PDF สดจากข้อมูลปัจจุบัน คืน dataUri (ใช้ตอน preview/แก้ไข/ดาวน์โหลด) */
function regenerateReportPdf(report){
  const docs = getReportDocs(report);
  if(docs.length){
    const sig = report.signature || (docs[0] && docs[0].signature) || '';
    const pdf = buildPdf(docs, report.receiverName, sig, report.fileName);
    return pdf.output('datauristring');
  }
  return report.dataUri || '';
}

function reviewReport(id){
  const x = (state.reports||[]).find(r=>r.id===id); if(!x) return;
  let uri = '';
  try{ uri = regenerateReportPdf(x); }catch(e){ uri = x.dataUri||''; }
  const docs = getReportDocs(x);
  let bodyHtml;
  if(uri){
    // ใช้ blob URL เพื่อให้ iframe แสดง PDF ได้ชัวร์กว่า data URI
    let src = uri;
    try{ src = dataUriToBlobUrl(uri); }catch(e){ src = uri; }
    bodyHtml = '<iframe src="'+src+'" style="width:100%;height:60vh;border:none;background:#fff;"></iframe>';
  } else {
    bodyHtml = '<div class="empty-state" style="padding:30px;"><div class="es-ic">'+ic('file',22)+'</div><div class="es-title">ไม่พบข้อมูลเอกสารสำหรับสร้าง PDF</div><div>ข้อมูลอาจถูกล้างหรือยังไม่ซิงก์</div></div>';
  }

      '<button class="btn btn-outline" onclick="closeModal()">ปิด</button>'+
      (uri?'<button class="btn btn-outline ripple" onclick="openReportNewTab(\''+id+'\')">'+ic('extlink',15)+' เปิดแท็บใหม่</button>':'')+
      (uri?'<button class="btn btn-primary ripple" onclick="downloadReport(\''+id+'\')">'+ic('download',16)+' ดาวน์โหลด</button>':'')+
    '</div>',
    {large:true}
  );
}
function dataUriToBlobUrl(uri){
  const parts = uri.split(',');
  const mime = (parts[0].match(/:(.*?);/)||[])[1] || 'application/pdf';
  const bin = atob(parts[1]);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return URL.createObjectURL(new Blob([arr], {type:mime}));
}
function downloadReport(id){
  const x = (state.reports||[]).find(r=>r.id===id); if(!x) return;
  const uri = regenerateReportPdf(x) || x.dataUri;
  if(!uri){ showToast('ไม่พบข้อมูลสำหรับสร้าง PDF', 'error'); return; }
  const a = document.createElement('a'); a.href=uri; a.download=x.fileName+'.pdf'; a.click();
}
function openReportNewTab(id){
  const x = (state.reports||[]).find(r=>r.id===id); if(!x) return;
  const uri = regenerateReportPdf(x) || x.dataUri; if(!uri) return;
  try{ const url = dataUriToBlobUrl(uri); window.open(url, '_blank'); }
  catch(e){ const w=window.open(); if(w){ w.document.write('<iframe src="'+uri+'" style="width:100%;height:100%;border:none;"></iframe>'); } }
}

/* ============================================================
   AUTO MAIL ENGINE
   ============================================================ */
function fillTemplate(tpl, doc, extra){
  extra = extra||{};
  return (tpl||'')
    .replace(/{senderName}/g, doc.senderName||'')
    .replace(/{receiverName}/g, doc.signerName||doc.receiverName||'')
    .replace(/{receiverDept}/g, doc.receiverDept||extra.dept||'')
    .replace(/{trackingNumber}/g, doc.tracking||'')
    .replace(/{signedAt}/g, formatDateTimeTH(doc.signedAt));
}
function queueMail(rec){
  if(!state.mails) state.mails=[];
  state.mails.unshift(rec);
  storageSet('mails', JSON.stringify(state.mails.slice(0,800)), true);
  logAction('Auto Mail', 'ส่งถึง '+rec.to+(rec.tracking?(' | '+rec.tracking):''));
  if(state.sheet.connected){
    api('sendMail', {to:rec.to, cc:rec.cc, subject:rec.subject, body:rec.body, senderName:state.settings.autoMail.senderName, tracking:rec.tracking}, {silent:true})
      .then(()=>{ rec.status='ส่งแล้ว'; storageSet('mails', JSON.stringify(state.mails.slice(0,800)), true); if(state.ui.currentView==='automail') renderAll(); })
      .catch(()=>{ rec.status='ส่งไม่สำเร็จ'; if(state.ui.currentView==='automail') renderAll(); });
  } else { rec.status='ส่งแล้ว (จำลอง)'; }
}
/* ส่งเมลตอน E-Sign: แจ้งฝ่าย (dept email) + แจ้งผู้ส่งกรณี Internal (empId@domain) */
function sendEsignMails(signed){
  const am = state.settings.autoMail;
  const now = new Date().toISOString();
  // 1) แจ้งฝ่าย — รวมทุกซองของฝ่ายเดียวกันเป็นเมลเดียว
  if(am.notifyDept){
    const byDept = {};
    signed.forEach(d=>{ (byDept[d.receiverDept]=byDept[d.receiverDept]||[]).push(d); });
    Object.keys(byDept).forEach(deptName=>{
      const dept = deptByName(deptName);
      const to = dept && dept.email ? dept.email : '';
      if(!to) return;
      const docs = byDept[deptName];
      const list = docs.map((d,i)=>(i+1)+'. '+(d.senderName||'-')+' — '+(d.tracking||'-')).join('\n');
      const first = docs[0];
      const body = fillTemplate(am.template, first, {dept:deptName}) + '\n\nรายการเอกสาร ('+docs.length+' ฉบับ):\n' + list;
      queueMail({id:genId('mail'), to, cc:am.ccList.slice(), subject:'แจ้งรับเอกสาร ฝ่าย'+deptName+' ('+docs.length+' ฉบับ)', body, tracking:docs.map(d=>d.tracking).join(', '), sentAt:now, status:'กำลังส่ง...', kind:'dept'});
    });
  }
  // 2) แจ้งผู้ส่ง (เฉพาะ Internal ที่มีรหัสพนักงาน) → รหัสพนักงาน@domain
  if(am.notifyEmployee){
    signed.filter(d=>d.type==='internal' && d.senderEmpId).forEach(d=>{
      const to = d.senderEmpId+'@'+(am.domain||'tidlor.com');
      const body = fillTemplate(am.template, d, {dept:d.receiverDept});
      queueMail({id:genId('mail'), to, cc:am.ccList.slice(), subject:'ใบกำกับส่ง: เอกสาร '+d.tracking+' ถูกเซ็นรับแล้ว', body, tracking:d.tracking, sentAt:now, status:'กำลังส่ง...', kind:'employee'});
    });
  }
}

async function saveSettingsToSheet(){
  if(!state.sheet.connected){

  try{
    showNetBar(true);
    await api('saveSettings', {settings:state.settings});
    await api('replaceAll', {table:'Documents', rows:state.documents.map(sheetSafeDoc)});
    await api('replaceAll', {table:'Reports', rows:reportsForSheet()});
    await api('replaceAll', {table:'Datalog', rows:state.datalog});
    await api('replaceAll', {table:'Mails', rows:state.mails||[]});
    showNetBar(false);
    logAction('Setting','บันทึกข้อมูลทั้งหมดลง Google Sheet');
    fireConfetti();
    showToast('บันทึกการตั้งค่าและข้อมูลทั้งหมดลง Google Sheet แล้ว', 'success');
  }catch(e){ showNetBar(false); showToast('บันทึกไม่สำเร็จ: '+e.message, 'error'); }
}

function makeThumb(label, colorA, colorB){
  try{
    const cv = document.createElement('canvas'); cv.width=220; cv.height=150;
    const ctx = cv.getContext('2d');
    if(!ctx) return null;
    const g = ctx.createLinearGradient(0,0,220,150); g.addColorStop(0,colorA); g.addColorStop(1,colorB);
    ctx.fillStyle=g; ctx.fillRect(0,0,220,150);
    ctx.fillStyle='rgba(255,255,255,.92)'; ctx.fillRect(16,30,188,104);
    ctx.strokeStyle='rgba(0,0,0,.12)'; ctx.strokeRect(16,30,188,104);
    ctx.beginPath(); ctx.moveTo(16,30); ctx.lineTo(110,86); ctx.lineTo(204,30); ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.stroke();
    ctx.fillStyle='#334'; ctx.font='bold 15px sans-serif'; ctx.fillText(label, 26, 118);
    ctx.fillStyle=colorA; ctx.fillRect(150,96,40,26); ctx.fillStyle='#fff'; ctx.font='bold 11px monospace'; ctx.fillText('STAMP',153,112);
    return cv.toDataURL('image/jpeg', 0.7);
  }catch(e){ return null; }
}
